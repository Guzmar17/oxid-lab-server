# R11 · In front of the three nodes, on rustfs-1, port 80 of its Wireguard address: what Azure
# calls ECB_S3_ENDPOINT. If a node is down, nginx sends the request to another.
#
#   docker run -d --name nginx --network host --restart unless-stopped \
#     -v ~/ecb-lab-server/deploy/isard/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine
events {}

http {
  upstream rustfs {
    # TODO R11
  }

  server {
    listen 80;
    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
      proxy_set_header Host $http_host;
      proxy_connect_timeout 300;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;
      proxy_pass http://rustfs;
    }
  }
}
